pipeline:
  on_converge:
    - name: assemble
      run: npm run assemble
      timeout: 30000
    - name: gitreins-track
      run: ./bin/gitreins-track 2>&1
      timeout: 15000
    - name: build
      run: npm run build
      timeout: 60000
    - name: verify-self-host
      run: npm run verify:self-host
      timeout: 60000
    - name: test
      run: npm test
      timeout: 120000
    - name: gitreins-guard
      run: ./bin/gitreins-track --guard-only 2>&1
      timeout: 130000
    - name: lint
      run: npm run lint 2>/dev/null || true
recovery:
  max_attempts: 2
  on_fail:
    - "echo 'Pipeline failed at $PREVIOUS_STEP'"
