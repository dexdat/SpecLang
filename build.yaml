pipeline:
  on_converge:
    - name: assemble
      run: npm run assemble
      timeout: 30000
    - name: build
      run: npm run build
      timeout: 60000
    - name: verify-self-host
      run: npm run verify:self-host
      timeout: 60000
    - name: test
      run: npm test
      timeout: 120000
    - name: lint (optional - skip if no eslint config)
      run: npm run lint 2>/dev/null || true
recovery:
  max_attempts: 2
  on_fail:
    - "echo 'Pipeline failed at $PREVIOUS_STEP'"
