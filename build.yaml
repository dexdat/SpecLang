pipeline:
  on_converge:
    - name: build
      run: npm run build
      timeout: 60000
    - name: test
      run: npm test
      timeout: 120000
    - name: lint (optional - skip if no eslint config)
      run: npm run lint 2>/dev/null || true
recovery:
  max_attempts: 2
  on_fail:
    - "echo 'Pipeline failed'"
