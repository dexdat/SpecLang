guards:
  secrets: true
  lint: false
  allow_skips: true
  tests: true
  test_command: npx vitest run --passWithNoTests 2>&1 | grep -q 'Tests.*passed' &&
    exit 0 || exit 1
  dead_code: false
  skylos: false
  lsp: true
  lsp_tools: ["typescript-language-server"]
  static_analysis: true
  static_analysis_tools: {}
  assemble: true
  assemble_command: npm run assemble 2>/dev/null || true
  build: true
  # DF-SPECLANG-013: gitreins 0.21.0 never reads `guards.build` /
  # `guards.build_command` (`gitreins config-validate` reports both as ignored
  # unknown keys); the arm that actually runs is the `build` step under
  # `pipeline.stages` below. Both name the same wrapper so a future version
  # that starts honoring this knob inherits the dependency-aware behaviour.
  build_command: bash scripts/guard-build.sh
  test_mode: diff
  go:
    build: true
    lint: true
    tests: true
evaluator:
  # Raised 100/2M -> 200/3M (QA-SPECLANG-009, 2026-11-17): two unchanged tier2
  # runs of one criterion died at "Iteration cap (100) reached (100.x used)"
  # with 0 criteria graded while burning only 428k and 737k of the 2M input
  # budget. The criterion is a live verification (it re-runs the suite and a
  # red-proof), so the judge loops on tool calls; per the cap-sizing rule,
  # repeated starvation at the same rung is a knob problem, not a merits one.
  # 737k at 100 iterations is ~7.3k/iter, and burn is quadratic in iterations,
  # so 200 iterations needs ~2.4M: the token ceiling moves with it.
  max_iterations: 200
  max_time: 30m
  max_input_tokens: 3M
  max_output_tokens: 0.5M
  tool_call_weight: 0.1
  fast_track: auto
  code_context_budget: 0.70
  compaction_threshold: 0.90

defaults:
  model: deepseek-v4-flash
  provider: deepseek-foreman
  api_key_env: GITREINS_LLM_API_KEY

history:
  enabled: true
  # Durable copy of every verdict is committed by GitReins to the
  # refs/gitreins/history ref; the working-tree .gitreins/history/ copy is
  # gitignored on purpose (see .gitignore and docs/gitreins-verdicts.md).
  storage: git
  # Retention / size guard: entries past this count are pruned, oldest first.
  max_verdicts: 1000
pipeline:
  stages:
  - id: tier1
    parallel: true
    steps:
    - id: secrets
      type: script
      run: "STAGED=$(git diff --cached --name-only --diff-filter=ACM)\n[ -z \"$STAGED\"\
        \ ] && exit 0\necho \"$STAGED\" | xargs -I{} grep -Pn '\\bsk-(?=[a-zA-Z0-9_-]{20,})[a-zA-Z0-9_-]*[A-Z0-9][a-zA-Z0-9_-]*|\\bghp_[a-zA-Z0-9]{36}'\
        \ {} 2>/dev/null && exit 1 || true\necho \"\u2713 No secrets detected\"\n"
    - id: build
      type: script
      # DF-SPECLANG-013: a fresh checkout has no node_modules, so a bare
      # `npm run build` graded the tree FAIL on a missing dependency. The
      # wrapper reports `GITREINS_SKIP: build=dependencies not installed` (and
      # exits 0) in that case, and otherwise propagates npm's real exit code.
      run: bash scripts/guard-build.sh
    - id: tests
      type: script
      run: npx vitest run --passWithNoTests 2>&1 | tail -3
  - id: tier2
    type: ai_eval
    "on":
    - pre-eval
    condition: 'true'
    max_iterations: 200
    max_time: 30m
    max_input_tokens: 3000000
    max_output_tokens: 400000
