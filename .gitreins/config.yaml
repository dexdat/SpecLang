guards:
  secrets: true
  lint: false
  tests: true
  test_command: npx vitest run --passWithNoTests 2>&1 | grep -q 'Tests.*passed' &&
    exit 0 || exit 1
  dead_code: false
  skylos: false
  lsp: true
  lsp_tools: ["typescript-language-server"]
  static_analysis: true
  static_analysis_tools: {}
  assemble: true
  assemble_command: npm run assemble 2>/dev/null || true
  build: true
  build_command: npm run build
  test_mode: diff
  go:
    build: true
    lint: true
    tests: true
evaluator:
  max_iterations: 100
  max_time: 30m
  max_input_tokens: 2M
  max_output_tokens: 0.5M
  tool_call_weight: 0.1
  fast_track: auto
  code_context_budget: 0.70
  compaction_threshold: 0.90

defaults:
  model: deepseek-v4-flash
  provider: deepseek-foreman
  api_key_env: GITREINS_LLM_API_KEY

history:
  enabled: false
pipeline:
  stages:
  - id: tier1
    parallel: true
    steps:
    - id: secrets
      type: script
      run: "STAGED=$(git diff --cached --name-only --diff-filter=ACM)\n[ -z \"$STAGED\"\
        \ ] && exit 0\necho \"$STAGED\" | xargs -I{} grep -Pn '\\bsk-(?=[a-zA-Z0-9_-]{20,})[a-zA-Z0-9_-]*[A-Z0-9][a-zA-Z0-9_-]*|\\bghp_[a-zA-Z0-9]{36}'\
        \ {} 2>/dev/null && exit 1 || true\necho \"\u2713 No secrets detected\"\n"
    - id: build
      type: script
      run: npm run build
    - id: tests
      type: script
      run: npx vitest run --passWithNoTests 2>&1 | tail -3
  - id: tier2
    type: ai_eval
    "on":
    - pre-eval
    condition: 'true'
    max_iterations: 100
    max_time: 30m
    max_input_tokens: 2000000
    max_output_tokens: 400000
