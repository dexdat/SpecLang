# GitReins Configuration — SpecLang
guards:
  secrets: true
  lint: false          # eslint not installed
  tests: true
  test_command: "npx vitest run --passWithNoTests 2>&1 | grep -q 'Tests.*passed' && exit 0 || exit 1"
  dead_code: false     # Python AST, not applicable for TypeScript
  skylos: false
  assemble: true
  assemble_command: "npm run assemble 2>/dev/null || true"
  build: true
  build_command: "npm run build"

evaluator:
  max_iterations: 25

pipeline:
  stages:
    - id: tier1
      parallel: true
      steps:
        - id: secrets
          type: script
          run: |
            STAGED=$(git diff --cached --name-only --diff-filter=ACM)
            [ -z "$STAGED" ] && exit 0
            echo "$STAGED" | xargs -I{} grep -Pn 'sk-[a-zA-Z0-9_-]{20,}|ghp_[a-zA-Z0-9]{36}' {} 2>/dev/null && exit 1 || true
            echo "✓ No secrets detected"
        - id: build
          type: script
          run: "npm run build"
        - id: tests
          type: script
          run: "npx vitest run --passWithNoTests 2>&1 | tail -3"
    - id: tier2
      type: ai_eval
      on: [pre-eval]
      condition: "true"
      max_iterations: 25
