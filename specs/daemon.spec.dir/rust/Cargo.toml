[package]
name = "speclangd"
version = "0.1.0"
edition = "2021"
description = "Reactive file watcher daemon for SpecLang cascade"
license = "MIT"
repository = "https://github.com/speclang/speclang"

[dependencies]
notify = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["full", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.0"
assert_fs = "1.0"
