name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and guard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test
        env:
          # vitest.config.ts already redirects TMPDIR to .tmp/, but
          # being explicit here makes the CI environment reproducible.
          TMPDIR: ${{ github.workspace }}/.tmp

      - name: Lint (graceful when no config)
        # eslint.config.js is not yet committed; this step is non-blocking
        # until CI-005 lands the lint configuration.
        continue-on-error: true
        run: npm run lint

      - name: Install GitReins
        # GitReins is the project's git-native quality gate (secrets +
        # lint + diff-mode tests). Install the latest PyPI release.
        run: pipx install gitreins

      - name: Run GitReins Tier 1 guard
        # Block commits with secrets, lint failures, or test regressions.
        # Uses the same .gitreins/config.yaml as the local pre-commit hook.
        run: gitreins guard

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-${{ github.run_id }}
          path: |
            .tmp/
            dist/
            coverage/
          retention-days: 7