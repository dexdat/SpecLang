# speclang-header lines:425
# id: @specs/ci
# version: 1.3.0
# layer: 4
# target: .github/workflows/ci.yml
# tags: [ci, github-actions, testing, tier2, gitreins, coverage]
# short: GitHub Actions CI workflow (Tier 1 + Tier 2 review + coverage reporting)
# depends_on:
#   - "@ref:specs/core"
# ---
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and guard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        # fetch-depth: 0 pulls full git history so tests that filter by
        # git author (e.g. `speclang history --author <name>`) can find
        # commits authored before the most recent merge. Without this,
        # CI defaults to a shallow clone (depth: 1) and any
        # history-based test that expects historical commits fails
        # with empty output.
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install pre-commit hook
        # CI-005's acceptance tests (`tests/ci/ci005-precommit-hook.test.ts`)
        # read the project's pre-commit hook from `.git/hooks/pre-commit`
        # and verify it invokes `gitreins guard`. GitHub Actions'
        # `actions/checkout` does NOT install git hooks by default — we
        # must wire them up explicitly so the hook-exists assertion
        # passes.
        #
        # Strategy: the canonical hook lives at `.githooks/pre-commit`
        # (tracked in the repo) and is symlinked to `.git/hooks/pre-commit`
        # by `setup.sh` for local devs and by this step for CI. Pointing
        # `core.hooksPath` at `.githooks` makes git pick up the tracked
        # script directly on a fresh CI clone — no `gitreins install`
        # race (GitReins isn't installed until step 12). The symlink at
        # `.git/hooks/pre-commit` keeps the CI-005 AC1 path-based
        # assertion working without test changes.
        #
        # See specs/ci.spec.md §CI-005 acceptance criteria AC1 for the
        # "hook exists and is executable" contract.
        run: |
          if [ -f .githooks/pre-commit ]; then
            mkdir -p .git/hooks
            ln -sf ../../.githooks/pre-commit .git/hooks/pre-commit
            chmod +x .githooks/pre-commit .git/hooks/pre-commit
            git config core.hooksPath .githooks
            echo "✓ pre-commit hook installed (.githooks/pre-commit + .git/hooks/pre-commit symlink, core.hooksPath=.githooks)"
          else
            echo "⚠ .githooks/pre-commit missing — CI-005 AC1 will fail"
            exit 1
          fi

      - name: Install gitleaks
        # CI-005's acceptance tests (AC3 + AC6 in
        # `tests/ci/ci005-precommit-hook.test.ts`) invoke `gitleaks detect`
        # against scratch repos. Without the gitleaks binary, execFile
        # returns ENOENT (a string), and `Number(ENOENT)` becomes `NaN`,
        # causing `expect(gl.status).toBe(1)` to fail with
        # "expected NaN to be 1". Install gitleaks before `Run tests`
        # so the assertions execute against the real scanner.
        #
        # Downloads the gitleaks v8.30.1 binary directly from GitHub
        # releases — no third-party action, no license secret required.
        # Placed in /usr/local/bin so it's on PATH for the test assertions
        # that call `gitleaks detect` via execFile.
        run: |
          GITLEAKS_VER="8.30.1"
          GITLEAKS_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz"
          curl -sSfL "$GITLEAKS_URL" | sudo tar -xz -C /usr/local/bin gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version
          echo "✓ gitleaks $(gitleaks version) installed"

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test
        env:
          # vitest.config.ts already redirects TMPDIR to .tmp/, but
          # being explicit here makes the CI environment reproducible.
          TMPDIR: ${{ github.workspace }}/.tmp

      - name: Generate coverage report (CI-006)
        # Runs the same suite with `--coverage` so the v8 provider writes
        # `coverage/coverage-final.json`, `coverage/index.html`, and prints
        # the table to stdout. Report is uploaded as an artifact so PR
        # authors can inspect it via the Actions UI.
        # `test:coverage` is wired in package.json (uses the local vitest
        # binary + TMPDIR redirect) so the env below is purely belt-and-
        # braces — but having it explicit in CI keeps the environment
        # reproducible when a developer runs locally with system /tmp.
        run: npm run test:coverage
        env:
          TMPDIR: ${{ github.workspace }}/.tmp

      - name: Upload coverage artifact (CI-006)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage/coverage-final.json
            coverage/index.html
          retention-days: 14
          if-no-files-found: warn

      - name: Write coverage summary
        if: always()
        # Print a short coverage table to the job summary so reviewers see
        # the numbers in the GitHub UI without downloading the artifact.
        # Uses the `text` reporter's stdout output by re-running vitest in
        # summary mode (lightweight — does NOT re-execute the suite)
        # against the already-generated `coverage-final.json`.
        run: |
          if [ ! -f coverage/coverage-final.json ]; then
            echo "## 📊 Coverage Report" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠ No coverage report was generated" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "## 📊 Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the full HTML report from the **coverage-\${{ github.run_id }}** artifact above." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PYEOF'
          import json, sys
          try:
              with open('coverage/coverage-final.json') as f:
                  data = json.load(f)
              total = data.get('total', {})
              keys = ('lines','statements','functions','branches')
              for k in keys:
                  pct = total.get(k, {}).get('pct', 'n/a')
                  print(f"| {k} | {pct}% |")
          except Exception as e:
              print(f"| error | {e} |")
          PYEOF

      - name: Lint (graceful when no config)
        # Run ESLint only when an eslint.config.* file is present in the
        # repo. When absent (current state — CI-005 lands lint config),
        # the step is a no-op that exits 0 so the job stays green.
        # The legacy `npm run lint` invocation exits 127 because the
        # `eslint` binary isn't installed yet — checking for the config
        # file is the correct graceful-degradation path described in
        # specs/ci.spec.md §2.
        run: |
          if [ -f eslint.config.js ] || [ -f eslint.config.mjs ] || [ -f eslint.config.cjs ] || [ -f .eslintrc.js ] || [ -f .eslintrc.json ]; then
            echo "Lint config found — running eslint"
            npm run lint
          else
            echo "No lint config present — skipping (CI-005 lands ESLint config)"
            exit 0
          fi

      - name: Install GitReins
        # GitReins is the project's git-native quality gate (secrets +
        # lint + diff-mode tests). Install the latest PyPI release.
        run: pipx install gitreins

      - name: Run GitReins Tier 1 guard
        # Block commits with secrets, lint failures, or test regressions.
        # Uses the same .gitreins/config.yaml as the local pre-commit hook.
        run: gitreins guard

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-${{ github.run_id }}
          path: |
            .tmp/
            dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # Tier 2: LLM-driven PR review (CI-004)
  # Runs on PRs to main and pushes to develop. The DeepSeek V4 Flash
  # judge evaluates the 8 PR-shaped criteria from .gitreins/tasks.yaml
  # and the verdict is posted as a single PR comment (idempotent).
  #
  # Tier 2 is ADVISORY — it does not block the Tier 1 merge gate.
  # continue-on-error: true ensures LLM hiccups don't break the PR.
  # ─────────────────────────────────────────────────────────────────
  review:
    name: Tier 2 LLM review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run for PRs (always review) and develop pushes (catches
    # integration issues before they hit main). Pushes to main are
    # post-merge — no review needed.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    needs: build
    continue-on-error: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for diff context

      - name: Setup Python 3.11 (for pipx + gitreins)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js 20 (for diff inspection)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pipx
        run: pipx ensurepath

      - name: Install GitReins
        run: pipx install gitreins

      - name: Verify DeepSeek API key is configured
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::DEEPSEEK_API_KEY secret is not configured."
            echo "::error::Add it at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "::error::Tier 2 review is advisory — this job will continue but produce no verdict."
            exit 0
          fi
          echo "✓ DEEPSEEK_API_KEY present (${#DEEPSEEK_API_KEY} chars)"

      - name: Recreate ci-pr-review task with canonical 8 criteria
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITREINS_LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITREINS_LLM_BASE_URL: https://api.deepseek.com/v1
          GITREINS_LLM_MODEL: deepseek-v4-flash
        # The create command is idempotent: it overwrites the existing
        # task entry, ensuring the latest 8 criteria are always loaded.
        run: |
          gitreins task create ci-pr-review \
            "SpecLang PR review — Tier 2 LLM evaluation" \
            "Every modified .ts file passes tsc --noEmit (no type errors in the PR's diff)" \
            "Every new exported function, class, or type added in src/ has a corresponding test under tests/ that exercises it" \
            "The PR adds at least one entry to CHANGELOG.md or the ## Next Wake section of .hermes/acceptance-criteria.md, or the diff is documentation-only (no src/ changes)" \
            "No TODO, FIXME, or XXX markers were added in src/ (excluding tests/, bin/, and dist/)" \
            "No console.log debug statements remain in production code under src/ (tests/, bin/, and dist/ excluded)" \
            "Every new public export (function, class, interface, type) in src/ has JSDoc with @param and @returns" \
            "No dead code in changed files: no unreachable branches, no unused exports, no orphaned helpers left behind by the PR" \
            "The PR's spec coverage matches its source changes — every modified .spec.md has a matching edit in src/ or tests/"

      - name: Start the task
        env:
          GITREINS_LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITREINS_LLM_BASE_URL: https://api.deepseek.com/v1
          GITREINS_LLM_MODEL: deepseek-v4-flash
        run: gitreins task start ci-pr-review

      - name: Run Tier 2 evaluation (DeepSeek V4 Flash)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITREINS_LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITREINS_LLM_BASE_URL: https://api.deepseek.com/v1
          GITREINS_LLM_MODEL: deepseek-v4-flash
        # 5-min cap; the judge writes the verdict JSON to
        # .gitreins/history/<date>/<hash>/verdict.json regardless of
        # pass/fail/timeout. Even a timeout produces a partial verdict.
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "Skipping Tier 2 evaluation — DEEPSEEK_API_KEY not set"
            mkdir -p .gitreins/history/skip
            echo '{"status":"SKIPPED","reason":"DEEPSEEK_API_KEY not configured"}' \
              > .gitreins/history/skip/verdict.json
            exit 0
          fi
          timeout 300 gitreins task complete ci-pr-review || {
            echo "::warning::Tier 2 evaluation exited non-zero (likely timeout or LLM error)"
            echo "::warning::Verdict may be partial — see .gitreins/history/"
          }

      - name: Locate verdict JSON
        id: verdict
        run: |
          # Find the most recent verdict.json from the run. The history
          # directory is gitignored, so this is a fresh capture.
          VERDICT_FILE=$(find .gitreins/history -name verdict.json -type f -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)
          if [ -z "$VERDICT_FILE" ]; then
            echo "::warning::No verdict.json found — Tier 2 produced no output"
            echo "verdict_path=" >> "$GITHUB_OUTPUT"
          else
            echo "Found verdict: $VERDICT_FILE"
            echo "verdict_path=$VERDICT_FILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Post verdict to PR (idempotent)
        if: github.event_name == 'pull_request' && steps.verdict.outputs.verdict_path != ''
        uses: actions/github-script@v7
        env:
          VERDICT_PATH: ${{ steps.verdict.outputs.verdict_path }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const fs = require('fs');
            const verdictPath = process.env.VERDICT_PATH;
            const runId = process.env.RUN_ID;
            const runUrl = process.env.RUN_URL;
            const prNumber = process.env.PR_NUMBER;
            if (!verdictPath || !fs.existsSync(verdictPath)) {
              core.setFailed('Verdict file not found');
              return;
            }
            const verdict = JSON.parse(fs.readFileSync(verdictPath, 'utf8'));
            const marker = '<!-- gitreins-tier2 -->';

            // GitReins verdict.json shape (verified 2026-06-21):
            //   { passed: bool, items: [], stages: { tier2: { steps: [{ output: string }] } }, summary: string }
            // The per-criterion PASS/FAIL data is in the `output` string
            // as `  ✓ criterion: evidence` or `  ✗ criterion: evidence` lines.
            const tier2Step = (verdict.stages && verdict.stages.tier2 && verdict.stages.tier2.steps && verdict.stages.tier2.steps[0]) || {};
            const outputText = tier2Step.output || verdict.summary || '';
            const passed = verdict.passed === true;

            // Parse per-criterion lines from the output string.
            const rows = [];
            const lines = outputText.split('\n');
            for (const line of lines) {
              // Match "  ✓ <criterion>: <evidence>" or "  ✗ <criterion>: <evidence>"
              // Allow both Unicode checkmarks; FAIL lines have ✗ in them.
              const m = line.match(/^\s*[✓✗]\s+(.+?):\s*(.*)$/);
              if (!m) continue;
              const after = m[1].trim();
              const evidence = (m[2] || '').trim().replace(/\|/g, '\\|').slice(0, 200);
              const linePassed = line.indexOf('✓') !== -1 && line.indexOf('✗') === -1;
              const status = linePassed ? '✓ PASS' : '✗ FAIL';
              rows.push('| ' + (rows.length + 1) + '. ' + after + ' | ' + status + ' | ' + evidence + ' |');
            }

            // Build status summary
            const passCount = rows.filter(function (r) { return r.indexOf('✓ PASS') !== -1; }).length;
            const failCount = rows.length - passCount;
            const statusDetail = passed
              ? 'PASS ✓'
              : (failCount > 0 ? 'FAIL ✗ (' + failCount + ' of ' + rows.length + ')' : 'FAIL ✗');
            const icon = passed ? '✅' : '⚠️';

            // If no per-criterion rows were parsed (LLM timed out or
            // returned summary-only), show the raw output as evidence.
            const body = marker + '\n'
              + '## ' + icon + ' GitReins Tier 2 Review\n'
              + '\n'
              + '**Verdict:** ' + statusDetail
              + '  |  **Run:** [`' + runId + '`](' + runUrl + ')'
              + '  |  **PR:** #' + prNumber + '\n'
              + '\n'
              + (rows.length > 0
                  ? '| # | Criterion | Status | Evidence |\n|---|-----------|--------|----------|\n' + rows.join('\n') + '\n'
                  : '> No per-criterion breakdown available. Verdict: **' + (passed ? 'PASS' : 'FAIL') + '**. Raw output below.\n>\n> ```\n' + outputText.slice(0, 1500) + '\n> ```\n')
              + '\n'
              + '<sub>Powered by DeepSeek V4 Flash · criteria from `.gitreins/tasks.yaml` · `specs/ci.spec.md` §Tier 2 LLM Evaluation (CI-004)</sub>\n';

            // Find existing comment by marker, update or create
            github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            }).then(function (res) {
              const existing = res.data.find(function (c) { return c.body && c.body.includes(marker); });
              if (existing) {
                return github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: body,
                }).then(function () {
                  core.info('Updated existing Tier 2 comment (id=' + existing.id + ')');
                });
              }
              return github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              }).then(function () {
                core.info('Posted new Tier 2 comment');
              });
            });

      - name: Write job summary
        if: always()
        run: |
          VERDICT_FILE="${{ steps.verdict.outputs.verdict_path }}"
          if [ -z "$VERDICT_FILE" ] || [ ! -f "$VERDICT_FILE" ]; then
            echo "## 🤖 GitReins Tier 2 Review" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Verdict:** ⚠ no verdict produced" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "## 🤖 GitReins Tier 2 Review" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat "$VERDICT_FILE" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload verdict artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier2-verdict-${{ github.run_id }}
          path: .gitreins/history/
          retention-days: 14